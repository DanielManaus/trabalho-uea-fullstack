services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbitboard-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-5200}:5200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5200/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5200}
    container_name: orbitboard-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
